<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Preferred Vendor Directory</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel Compiler for React JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Google Apps Script Web App Endpoint & Sheet Link
    const DEFAULT_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxsofSBladdqGihNemQY7h5HpR04mm4oCgAACNdD0tFzRD7PajIToIULCxQkwaPizds/exec';
    const GOOGLE_SHEET_URL = 'https://docs.google.com/spreadsheets/d/1lPW-dHJ7Okj4m-UIUlg3qZbXBCnW3w6ITXs8Cp3R3q8/edit?gid=0#gid=0';

    const CATEGORIES = [
      { id: 'Mortgage & Lending', name: 'Mortgage & Lending' },
      { id: 'Legal & Attorney', name: 'Legal & Attorney' },
      { id: 'Home Inspection', name: 'Home Inspection' },
      { id: 'Title & Closing', name: 'Title & Closing' },
      { id: 'Insurance', name: 'Insurance Agents' },
      { id: 'Contractors & Handyman', name: 'General Contractor / Handyman' },
      { id: 'HVAC & Plumbing', name: 'HVAC & Plumbing' },
      { id: 'Electrical & Roofing', name: 'Electrical & Roofing' },
      { id: 'Staging & Photography', name: 'Staging & Media' },
      { id: 'Moving & Cleaning', name: 'Moving & Cleaning' }
    ];

    const INITIAL_VENDORS = [
      {
        id: '1',
        companyName: 'Apex Home Loans',
        category: 'Mortgage & Lending',
        contactPerson: 'Sarah Jenkins',
        phone: '(555) 234-5678',
        email: 'sjenkins@apexhomeloans.com',
        website: 'apexhomeloans.com',
        rating: 5,
        status: 'Preferred',
        notes: 'Fast approvals, excellent with first-time buyers.',
        specialties: 'Conventional, FHA, VA Loans'
      }
    ];

    const normalizeVendorData = (item, index) => {
      return {
        id: String(item.id || item.ID || index + 1),
        companyName: item.Name || item.companyName || item['Company Name'] || item.name || '',
        category: item.Category || item.category || 'Mortgage & Lending',
        contactPerson: item.Contact || item.contactPerson || item['Contact Person'] || item.contact || '',
        phone: item.Phone || item.phone || '',
        email: item.Email || item.email || '',
        website: item.Website || item.website || item['Address / Website'] || '',
        rating: Number(item.Rating || item.rating || 5),
        status: item.Status || item.status || 'Preferred',
        notes: item.Notes || item.notes || '',
        specialties: item.Specialties || item.specialties || ''
      };
    };

    function App() {
      const [scriptUrl, setScriptUrl] = useState(() => localStorage.getItem('re_apps_script_url') || DEFAULT_SCRIPT_URL);
      const [tempUrl, setTempUrl] = useState(() => localStorage.getItem('re_apps_script_url') || DEFAULT_SCRIPT_URL);
      const [vendors, setVendors] = useState(INITIAL_VENDORS);
      const [isLoading, setIsLoading] = useState(false);
      const [syncStatus, setSyncStatus] = useState('connected');
      
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('All');
      const [selectedStatus, setSelectedStatus] = useState('All');
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingVendor, setEditingVendor] = useState(null);

      const [formData, setFormData] = useState({
        companyName: '', category: 'Mortgage & Lending', contactPerson: '',
        phone: '', email: '', website: '', rating: 5, status: 'Preferred', notes: '', specialties: ''
      });

      const fetchFromGoogleSheet = async (urlToUse = scriptUrl) => {
        if (!urlToUse) return;
        setIsLoading(true);
        try {
          const response = await fetch(urlToUse);
          const result = await response.json();
          let rawList = Array.isArray(result) ? result : (result?.data || []);
          if (rawList.length > 0) {
            setVendors(rawList.map((item, idx) => normalizeVendorData(item, idx)));
            setSyncStatus('connected');
          }
        } catch (err) {
          console.error('Fetch error:', err);
          setSyncStatus('error');
        } finally {
          setIsLoading(false);
        }
      };

      useEffect(() => {
        fetchFromGoogleSheet();
      }, []);

      const handleSaveVendor = async (e) => {
        e.preventDefault();
        if (!formData.companyName.trim()) return;

        const vendorToSave = editingVendor
          ? { ...formData, id: editingVendor.id }
          : { ...formData, id: Date.now().toString() };

        if (editingVendor) {
          setVendors(vendors.map(v => v.id === editingVendor.id ? vendorToSave : v));
        } else {
          setVendors([vendorToSave, ...vendors]);
        }

        setIsModalOpen(false);

        if (scriptUrl) {
          try {
            await fetch(scriptUrl, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                action: 'add',
                name: vendorToSave.companyName,
                category: vendorToSave.category,
                contact: vendorToSave.contactPerson,
                phone: vendorToSave.phone,
                email: vendorToSave.email,
                website: vendorToSave.website,
                status: vendorToSave.status,
                rating: vendorToSave.rating,
                notes: vendorToSave.notes,
                specialties: vendorToSave.specialties
              })
            });
            setTimeout(() => fetchFromGoogleSheet(scriptUrl), 1500);
          } catch (err) {
            console.error('Save sync error:', err);
          }
        }
      };

      const handleOpenModal = (vendor = null) => {
        if (vendor) {
          setEditingVendor(vendor);
          setFormData({ ...vendor });
        } else {
          setEditingVendor(null);
          setFormData({
            companyName: '', category: 'Mortgage & Lending', contactPerson: '',
            phone: '', email: '', website: '', rating: 5, status: 'Preferred', notes: '', specialties: ''
          });
        }
        setIsModalOpen(true);
      };

      const filteredVendors = useMemo(() => {
        return vendors.filter(v => {
          const matchesSearch = !searchQuery || 
            (v.companyName && v.companyName.toLowerCase().includes(searchQuery.toLowerCase())) ||
            (v.contactPerson && v.contactPerson.toLowerCase().includes(searchQuery.toLowerCase())) ||
            (v.notes && v.notes.toLowerCase().includes(searchQuery.toLowerCase()));
          const matchesCategory = selectedCategory === 'All' || v.category === selectedCategory;
          const matchesStatus = selectedStatus === 'All' || v.status === selectedStatus;
          return matchesSearch && matchesCategory && matchesStatus;
        });
      }, [vendors, searchQuery, selectedCategory, selectedStatus]);

      return (
        <div className="min-h-screen bg-slate-900 text-slate-100 p-4 md:p-8">
          <div className="max-w-7xl mx-auto space-y-6">
            
            {/* Header */}
            <header className="flex flex-col md:flex-row justify-between items-start md:items-center bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg gap-4">
              <div>
                <h1 className="text-2xl font-bold text-white">Preferred Vendor Directory</h1>
                <p className="text-slate-400 text-sm">Real-Time Google Sheets Integration</p>
              </div>
              <div className="flex items-center gap-3">
                <button 
                  onClick={() => fetchFromGoogleSheet()}
                  disabled={isLoading}
                  className="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-sm font-semibold transition"
                >
                  {isLoading ? 'Syncing...' : 'Sync Sheet'}
                </button>
                <a 
                  href={GOOGLE_SHEET_URL} 
                  target="_blank" 
                  rel="noreferrer"
                  className="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg text-sm font-semibold border border-slate-600 transition"
                >
                  Open Sheet
                </a>
                <button
                  onClick={() => handleOpenModal()}
                  className="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-sm font-semibold transition"
                >
                  + Add Vendor
                </button>
              </div>
            </header>

            {/* Controls */}
            <div className="grid md:grid-cols-3 gap-4">
              <input 
                type="text" 
                placeholder="Search vendors..." 
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                className="bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-sm text-slate-100 focus:outline-none focus:border-blue-500 md:col-span-2"
              />
              <select 
                value={selectedCategory} 
                onChange={(e) => setSelectedCategory(e.target.value)}
                className="bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-sm text-slate-100 focus:outline-none focus:border-blue-500"
              >
                <option value="All">All Categories</option>
                {CATEGORIES.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
              </select>
            </div>

            {/* Vendor List */}
            <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
              {filteredVendors.map((vendor) => (
                <div key={vendor.id} className="bg-slate-800 p-5 rounded-xl border border-slate-700 space-y-3">
                  <div className="flex justify-between items-start">
                    <div>
                      <span className="text-xs px-2 py-1 rounded bg-blue-900/50 text-blue-300 font-semibold border border-blue-700/50">
                        {vendor.category}
                      </span>
                      <h3 className="text-lg font-bold text-white mt-1">{vendor.companyName}</h3>
                    </div>
                    <span className="text-xs px-2 py-1 rounded bg-emerald-900/40 text-emerald-300 border border-emerald-700/50 font-medium">
                      {vendor.status}
                    </span>
                  </div>

                  <div className="text-sm text-slate-300 space-y-1">
                    <div><strong className="text-slate-400">Contact:</strong> {vendor.contactPerson || '—'}</div>
                    <div><strong className="text-slate-400">Phone:</strong> {vendor.phone || '—'}</div>
                    <div><strong className="text-slate-400">Email:</strong> {vendor.email || '—'}</div>
                    <div><strong className="text-slate-400">Website:</strong> {vendor.website || '—'}</div>
                  </div>

                  {vendor.notes && (
                    <p className="text-xs bg-slate-900/60 p-2.5 rounded text-slate-400 italic border border-slate-800">
                      "{vendor.notes}"
                    </p>
                  )}
                </div>
              ))}
            </div>

            {/* Modal */}
            {isModalOpen && (
              <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50">
                <div className="bg-slate-800 p-6 rounded-xl border border-slate-700 max-w-md w-full space-y-4">
                  <h2 className="text-lg font-bold text-white">{editingVendor ? 'Edit Vendor' : 'Add New Vendor'}</h2>
                  <form onSubmit={handleSaveVendor} className="space-y-3">
                    <input 
                      required 
                      type="text" 
                      placeholder="Company Name" 
                      value={formData.companyName} 
                      onChange={e => setFormData({...formData, companyName: e.target.value})} 
                      className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm text-slate-100" 
                    />
                    <select 
                      value={formData.category} 
                      onChange={e => setFormData({...formData, category: e.target.value})} 
                      className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm text-slate-100"
                    >
                      {CATEGORIES.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                    </select>
                    <input 
                      type="text" 
                      placeholder="Contact Person" 
                      value={formData.contactPerson} 
                      onChange={e => setFormData({...formData, contactPerson: e.target.value})} 
                      className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm text-slate-100" 
                    />
                    <input 
                      type="text" 
                      placeholder="Phone" 
                      value={formData.phone} 
                      onChange={e => setFormData({...formData, phone: e.target.value})} 
                      className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm text-slate-100" 
                    />
                    <input 
                      type="email" 
                      placeholder="Email" 
                      value={formData.email} 
                      onChange={e => setFormData({...formData, email: e.target.value})} 
                      className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm text-slate-100" 
                    />
                    <textarea 
                      placeholder="Notes" 
                      value={formData.notes} 
                      onChange={e => setFormData({...formData, notes: e.target.value})} 
                      className="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm text-slate-100"
                    ></textarea>
                    
                    <div className="flex justify-end gap-2 pt-2">
                      <button 
                        type="button" 
                        onClick={() => setIsModalOpen(false)} 
                        className="px-4 py-2 bg-slate-700 rounded text-sm font-semibold"
                      >
                        Cancel
                      </button>
                      <button 
                        type="submit" 
                        className="px-4 py-2 bg-emerald-600 rounded text-sm font-semibold text-white"
                      >
                        Save Vendor
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
