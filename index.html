<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Preferred Vendor Directory</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>

  <!-- React & ReactDOM (Production) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel Standalone (JSX Compiler) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons Bundle -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // Categories definition
    const CATEGORIES = [
      { id: 'Mortgage & Lending', name: 'Mortgage & Lending' },
      { id: 'Legal & Attorney', name: 'Legal & Attorney' },
      { id: 'Home Inspection', name: 'Home Inspection' },
      { id: 'Title & Closing', name: 'Title & Closing' },
      { id: 'Insurance', name: 'Insurance Agents' },
      { id: 'Contractors & Handyman', name: 'General Contractor / Handyman' },
      { id: 'HVAC & Plumbing', name: 'HVAC & Plumbing' },
      { id: 'Electrical & Roofing', name: 'Electrical & Roofing' },
      { id: 'Staging & Photography', name: 'Staging & Media' },
      { id: 'Moving & Cleaning', name: 'Moving & Cleaning' },
    ];

    const INITIAL_VENDORS = [
      {
        id: '1',
        companyName: 'Apex Home Loans',
        category: 'Mortgage & Lending',
        contactPerson: 'Sarah Jenkins',
        phone: '(555) 234-5678',
        email: 'sjenkins@apexhomeloans.com',
        website: 'apexhomeloans.com',
        rating: 5,
        status: 'Preferred',
        notes: 'Fast approvals, excellent with first-time buyers. 21-day closing record.',
        specialties: 'Conventional, FHA, VA Loans'
      },
      {
        id: '2',
        companyName: 'Prestige Settlement & Title',
        category: 'Title & Closing',
        contactPerson: 'David Ross',
        phone: '(555) 014-9922',
        email: 'dross@prestigetitle.com',
        website: 'prestigetitle.com',
        rating: 5,
        status: 'Preferred',
        notes: 'Smooth closings, excellent communication with buyers.',
        specialties: 'Title Insurance, Closings'
      }
    ];

    const normalizeVendorData = (item, index) => {
      return {
        id: String(item.id || item.ID || index + 1),
        companyName: item.Name || item.companyName || item['Company Name'] || item.name || '',
        category: item.Category || item.category || 'Mortgage & Lending',
        contactPerson: item.Contact || item.contactPerson || item['Contact Person'] || item.contact || '',
        phone: item.Phone || item.phone || '',
        email: item.Email || item.email || '',
        website: item.Website || item.website || item['Address / Website'] || '',
        rating: Number(item.Rating || item.rating || item['Rating (1-5 Stars)'] || 5),
        status: item.Status || item.status || item['Status (Preferred/Vetted/Secondary)'] || 'Preferred',
        notes: item.Notes || item.notes || item['Notes / Client Pitch'] || '',
        specialties: item.Specialties || item.specialties || ''
      };
    };

    const APPS_SCRIPT_CODE_SAMPLE = `// Copy & paste this code into Extensions > Apps Script in your Google Sheet
function doGet(e) {
  var sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
  var data = sheet.getDataRange().getValues();
  if (!data || data.length < 2) {
    return ContentService.createTextOutput(JSON.stringify([])).setMimeType(ContentService.MimeType.JSON);
  }
  var result = [];
  for (var i = 1; i < data.length; i++) {
    var row = data[i];
    if (!row[0] && !row[1] && !row[2]) continue;
    result.push({
      id: String(i),
      Name: row[0] || "",
      Category: row[1] || "General",
      Contact: row[2] || "",
      Phone: row[3] || "",
      Email: row[4] || "",
      Website: row[5] || "",
      Status: row[6] || "Preferred",
      Rating: row[7] || 5,
      Notes: row[8] || "",
      Specialties: row[9] || ""
    });
  }
  return ContentService.createTextOutput(JSON.stringify(result)).setMimeType(ContentService.MimeType.JSON);
}

function doPost(e) {
  try {
    var sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
    var params = JSON.parse(e.postData.contents);
    if (params.action === "add") {
      sheet.appendRow([
        params.name || "",
        params.category || "",
        params.contact || "",
        params.phone || "",
        params.email || "",
        params.website || "",
        params.status || "Preferred",
        params.rating || 5,
        params.notes || "",
        params.specialties || ""
      ]);
    } else if (params.action === "delete") {
      var targetId = parseInt(params.id, 10);
      if (targetId && targetId < sheet.getLastRow()) {
        sheet.deleteRow(targetId + 1);
      }
    }
    return ContentService.createTextOutput(JSON.stringify({ status: "success" })).setMimeType(ContentService.MimeType.JSON);
  } catch (err) {
    return ContentService.createTextOutput(JSON.stringify({ status: "error", message: err.toString() })).setMimeType(ContentService.MimeType.JSON);
  }
}`;

    function App() {
      const DEFAULT_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxsofSBladdqGihNemQY7h5HpR04mm4oCgAACNdD0tFzRD7PajIToIULCxQkwaPizds/exec';

      const [scriptUrl, setScriptUrl] = useState(() => localStorage.getItem('re_apps_script_url') || DEFAULT_SCRIPT_URL);
      const [tempUrl, setTempUrl] = useState(() => localStorage.getItem('re_apps_script_url') || DEFAULT_SCRIPT_URL);
      
      const [vendors, setVendors] = useState(() => {
        const saved = localStorage.getItem('re_preferred_vendors');
        return saved ? JSON.parse(saved) : INITIAL_VENDORS;
      });

      const [isLoading, setIsLoading] = useState(false);
      const [isSyncing, setIsSyncing] = useState(false);
      const [syncStatus, setSyncStatus] = useState('connected');
      
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('All');
      const [selectedStatus, setSelectedStatus] = useState('All');
      const [minRating, setMinRating] = useState(0);
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [showSetupGuide, setShowSetupGuide] = useState(false);
      const [editingVendor, setEditingVendor] = useState(null);
      const [copiedId, setCopiedId] = useState(null);
      const [viewMode, setViewMode] = useState('grid');
      const [clientShareModal, setClientShareModal] = useState({ open: false, vendors: [] });
      const [selectedForShare, setSelectedForShare] = useState([]);
      const [codeCopied, setCodeCopied] = useState(false);

      const [formData, setFormData] = useState({
        companyName: '', category: 'Mortgage & Lending', contactPerson: '',
        phone: '', email: '', website: '', rating: 5, status: 'Preferred',
        notes: '', specialties: ''
      });

      useEffect(() => {
        localStorage.setItem('re_preferred_vendors', JSON.stringify(vendors));
      }, [vendors]);

      useEffect(() => {
        if (scriptUrl) fetchFromGoogleSheet(scriptUrl);
      }, []);

      const fetchFromGoogleSheet = async (urlToUse = scriptUrl) => {
        if (!urlToUse) return;
        setIsLoading(true);
        try {
          const response = await fetch(urlToUse);
          const result = await response.json();
          let rawList = Array.isArray(result) ? result : (result?.data || []);
          if (rawList.length > 0) {
            setVendors(rawList.map((item, idx) => normalizeVendorData(item, idx)));
            setSyncStatus('connected');
          }
        } catch (err) {
          console.error('Fetch error:', err);
          setSyncStatus('error');
        } finally {
          setIsLoading(false);
        }
      };

      const handleSaveUrl = (e) => {
        e.preventDefault();
        const cleanUrl = tempUrl.trim();
        setScriptUrl(cleanUrl);
        localStorage.setItem('re_apps_script_url', cleanUrl);
        if (cleanUrl) fetchFromGoogleSheet(cleanUrl);
      };

      const handleOpenModal = (vendorToEdit = null) => {
        if (vendorToEdit) {
          setEditingVendor(vendorToEdit);
          setFormData({ ...vendorToEdit });
        } else {
          setEditingVendor(null);
          setFormData({
            companyName: '', category: 'Mortgage & Lending', contactPerson: '',
            phone: '', email: '', website: '', rating: 5, status: 'Preferred',
            notes: '', specialties: ''
          });
        }
        setIsModalOpen(true);
      };

      const handleSaveVendor = async (e) => {
        e.preventDefault();
        if (!formData.companyName.trim()) return;

        const vendorToSave = editingVendor
          ? { ...formData, id: editingVendor.id }
          : { ...formData, id: Date.now().toString() };

        if (editingVendor) {
          setVendors(vendors.map(v => v.id === editingVendor.id ? vendorToSave : v));
        } else {
          setVendors([vendorToSave, ...vendors]);
        }

        setIsModalOpen(false);

        if (scriptUrl) {
          setIsSyncing(true);
          try {
            await fetch(scriptUrl, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                action: 'add',
                name: vendorToSave.companyName,
                category: vendorToSave.category,
                contact: vendorToSave.contactPerson,
                phone: vendorToSave.phone,
                email: vendorToSave.email,
                website: vendorToSave.website,
                status: vendorToSave.status,
                rating: vendorToSave.rating,
                notes: vendorToSave.notes,
                specialties: vendorToSave.specialties
              })
            });
            setTimeout(() => fetchFromGoogleSheet(scriptUrl), 1500);
          } catch (err) {
            console.error('Sync error on save:', err);
          } finally {
            setIsSyncing(false);
          }
        }
      };

      const handleDeleteVendor = async (id) => {
        if (!window.confirm('Are you sure you want to delete this vendor?')) return;

        setVendors(vendors.filter(v => v.id !== id));

        if (scriptUrl) {
          setIsSyncing(true);
          try {
            await fetch(scriptUrl, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ action: 'delete', id: id })
            });
          } catch (err) {
            console.error('Sync error on delete:', err);
          } finally {
            setIsSyncing(false);
          }
        }
      };

      const filteredVendors = useMemo(() => {
        return vendors.filter(v => {
          const matchesSearch = 
            (v.companyName && v.companyName.toLowerCase().includes(searchQuery.toLowerCase())) ||
            (v.contactPerson && v.contactPerson.toLowerCase().includes(searchQuery.toLowerCase())) ||
            (v.specialties && v.specialties.toLowerCase().includes(searchQuery.toLowerCase())) ||
            (v.notes && v.notes.toLowerCase().includes(searchQuery.toLowerCase()));

          const matchesCategory = selectedCategory === 'All' || v.category === selectedCategory;
          const matchesStatus = selectedStatus === 'All' || v.status === selectedStatus;
          const matchesRating = Number(v.rating) >= minRating;

          return matchesSearch && matchesCategory && matchesStatus && matchesRating;
        });
      }, [vendors, searchQuery, selectedCategory, selectedStatus, minRating]);

      const copyToClipboard = (text) => {
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(text).catch(() => fallbackCopyTextToClipboard(text));
        } else {
          fallbackCopyTextToClipboard(text);
        }
      };

      const fallbackCopyTextToClipboard = (text) => {
        const textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.position = "fixed";
        textArea.style.top = "0";
        textArea.style.left = "0";
        textArea.style.opacity = "0";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        try {
          document.execCommand('copy');
        } catch (err) {
          console.error('Fallback copy failed:', err);
        }
        document.body.removeChild(textArea);
      };

      const handleCopyVendorInfo = (vendor) => {
        const text = `📌 ${vendor.companyName} (${vendor.category})\n👤 Contact: ${vendor.contactPerson || 'N/A'}\n📞 Phone: ${vendor.phone || 'N/A'}\n✉️ Email: ${vendor.email || 'N/A'}\n🌐 Website: ${vendor.website || 'N/A'}\n⭐ Rating: ${vendor.rating}/5\n💡 Notes: ${vendor.notes || 'Reliable vendor recommendation.'}`;

        copyToClipboard(text);
        setCopiedId(vendor.id);
        setTimeout(() => setCopiedId(null), 2000);
      };

      const handleShareSelected = () => {
        const selectedList = vendors.filter(v => selectedForShare.includes(v.id));
        setClientShareModal({ open: true, vendors: selectedList.length ? selectedList : filteredVendors });
      };

      const copyFormattedList = () => {
        const listToShare = clientShareModal.vendors;
        let formatted = `🏡 PREFERRED VENDOR RECOMMENDATIONS\nHere are our recommended professional contacts for your transaction:\n\n`;

        listToShare.forEach((v, index) => {
          formatted += `${index + 1}. ${v.companyName} [${v.category}]\n`;
          if (v.contactPerson) formatted += `   Contact: ${v.contactPerson}\n`;
          if (v.phone) formatted += `   Phone: ${v.phone}\n`;
          if (v.email) formatted += `   Email: ${v.email}\n`;
          if (v.website) formatted += `   Web: ${v.website}\n`;
          if (v.notes) formatted += `   Note: ${v.notes}\n`;
          formatted += `\n`;
        });

        copyToClipboard(formatted);
        alert('Formatted vendor list copied to clipboard!');
      };

      const exportToCSV = () => {
        const headers = ['ID', 'Company Name', 'Category', 'Contact Person', 'Phone', 'Email', 'Website', 'Rating', 'Status', 'Specialties', 'Notes'];
        const rows = filteredVendors.map(v => [
          `"${v.id || ''}"`, `"${v.companyName || ''}"`, `"${v.category || ''}"`,
          `"${v.contactPerson || ''}"`, `"${v.phone || ''}"`, `"${v.email || ''}"`,
          `"${v.website || ''}"`, v.rating, `"${v.status || ''}"`,
          `"${(v.specialties || '').replace(/"/g, '""')}"`, `"${(v.notes || '').replace(/"/g, '""')}"`
        ]);

        const csvContent = 'data:text/csv;charset=utf-8,' + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement('a');
        link.setAttribute('href', encodedUri);
        link.setAttribute('download', `preferred_vendors_${new Date().toISOString().slice(0, 10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const toggleSelectForShare = (id) => {
        setSelectedForShare(prev => prev.includes(id) ? prev.filter(item => item !== id) : [...prev, id]);
      };

      const copyCodeToClipboard = () => {
        copyToClipboard(APPS_SCRIPT_CODE_SAMPLE);
        setCodeCopied(true);
        setTimeout(() => setCodeCopied(false), 2500);
      };

      return (
        <div className="min-h-screen flex flex-col font-sans">
          
          {/* Top Bar for Sync URL */}
          <div className="bg-slate-900 text-slate-200 border-b border-slate-800 px-4 py-2.5 text-xs">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
              <form onSubmit={handleSaveUrl} className="flex items-center gap-2 w-full sm:w-auto flex-1 max-w-2xl">
                <span className="font-medium shrink-0 hidden md:inline">Google Sheet URL:</span>
                <input
                  type="text"
                  value={tempUrl}
                  onChange={(e) => setTempUrl(e.target.value)}
                  placeholder="https://script.google.com/macros/s/.../exec"
                  className="px-2.5 py-1 bg-slate-800 border border-slate-700 rounded text-xs text-white flex-1"
                />
                <button type="submit" className="px-3 py-1 bg-blue-600 text-white rounded font-medium hover:bg-blue-500">
                  Connect
                </button>
              </form>

              <div className="flex items-center gap-3">
                <span className={`font-medium ${syncStatus === 'connected' ? 'text-emerald-400' : 'text-rose-400'}`}>
                  {syncStatus === 'connected' ? 'Sheet Connected' : 'Connection Error'}
                </span>
                <button onClick={() => setShowSetupGuide(!showSetupGuide)} className="text-blue-400 font-medium">
                  Setup Guide
                </button>
              </div>
            </div>
          </div>

          {/* Setup Guide Drawer */}
          {showSetupGuide && (
            <div className="bg-slate-800 border-b border-slate-700 text-slate-200 px-4 py-6 text-sm">
              <div className="max-w-7xl mx-auto space-y-4">
                <div className="flex justify-between items-center">
                  <h3 className="font-bold text-white text-base">Apps Script Setup Instructions</h3>
                  <button onClick={() => setShowSetupGuide(false)} className="text-slate-400">✕</button>
                </div>
                <ol className="list-decimal list-inside space-y-1 text-xs text-slate-300">
                  <li>Open your Google Sheet &gt; Extensions &gt; Apps Script.</li>
                  <li>Paste the code below, then click Deploy &gt; New Deployment &gt; Web App.</li>
                  <li>Set access to "Anyone", deploy, and copy your Web App URL into the connection bar above.</li>
                </ol>
                <div className="relative">
                  <button onClick={copyCodeToClipboard} className="text-xs bg-slate-700 px-2 py-1 rounded text-blue-300 absolute top-2 right-2">
                    {codeCopied ? 'Copied!' : 'Copy Code'}
                  </button>
                  <pre className="bg-slate-950 p-4 rounded text-xs font-mono overflow-x-auto max-h-48 border border-slate-700">
                    {APPS_SCRIPT_CODE_SAMPLE}
                  </pre>
                </div>
              </div>
            </div>
          )}

          {/* Main App Header */}
          <header className="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-30 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
              <div>
                <h1 className="text-xl font-bold text-slate-900 dark:text-white">Preferred Vendor Directory</h1>
                <p className="text-xs text-slate-500">Live synced real estate vendor & contact directory</p>
              </div>

              <div className="flex items-center gap-2">
                <button onClick={handleShareSelected} className="px-3.5 py-2 rounded-lg text-sm bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 hover:bg-slate-200 transition">
                  Share with Client ({selectedForShare.length})
                </button>
                <button onClick={exportToCSV} className="px-3.5 py-2 rounded-lg text-sm bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 hover:bg-slate-200 transition">
                  Export CSV
                </button>
                <button onClick={() => handleOpenModal()} className="px-4 py-2 rounded-lg text-sm bg-blue-600 hover:bg-blue-500 text-white font-medium transition">
                  + Add Vendor
                </button>
              </div>
            </div>
          </header>

          {/* Main Controls & Vendors Grid */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 py-6 space-y-6">
            <div className="bg-white dark:bg-slate-800 p-4 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-4">
              <div className="flex flex-col md:flex-row gap-3">
                <input
                  type="text"
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  placeholder="Search vendor name, contact, notes, or specialty..."
                  className="w-full px-4 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm"
                />
                <select value={selectedStatus} onChange={(e) => setSelectedStatus(e.target.value)} className="px-3 py-2 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm">
                  <option value="All">All Statuses</option>
                  <option value="Preferred">Preferred</option>
                  <option value="Vetted">Vetted</option>
                  <option value="Secondary">Secondary</option>
                </select>
                <div className="flex items-center bg-slate-100 dark:bg-slate-900 p-1 rounded-lg border border-slate-200 dark:border-slate-700">
                  <button onClick={() => setViewMode('grid')} className={`px-3 py-1 rounded text-xs font-medium ${viewMode === 'grid' ? 'bg-white dark:bg-slate-800 shadow text-blue-600' : ''}`}>Grid</button>
                  <button onClick={() => setViewMode('table')} className={`px-3 py-1 rounded text-xs font-medium ${viewMode === 'table' ? 'bg-white dark:bg-slate-800 shadow text-blue-600' : ''}`}>Table</button>
                </div>
              </div>

              {/* Categories */}
              <div className="flex items-center gap-1.5 overflow-x-auto pb-1">
                <button onClick={() => setSelectedCategory('All')} className={`px-3 py-1.5 rounded-full text-xs font-medium border ${selectedCategory === 'All' ? 'bg-blue-600 text-white' : 'bg-slate-100 dark:bg-slate-800'}`}>
                  All ({vendors.length})
                </button>
                {CATEGORIES.map(cat => (
                  <button key={cat.id} onClick={() => setSelectedCategory(cat.id)} className={`px-3 py-1.5 rounded-full text-xs font-medium border whitespace-nowrap ${selectedCategory === cat.id ? 'bg-blue-600 text-white' : 'bg-slate-100 dark:bg-slate-800'}`}>
                    {cat.name}
                  </button>
                ))}
              </div>
            </div>

            {/* Grid / Table View */}
            {viewMode === 'grid' ? (
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                {filteredVendors.map(vendor => (
                  <div key={vendor.id} className="bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 p-5 space-y-3 relative flex flex-col justify-between">
                    <div className="space-y-3">
                      <div className="flex justify-between items-start">
                        <div>
                          <span className="text-xs px-2 py-0.5 rounded bg-blue-100 dark:bg-blue-900/50 text-blue-700 dark:text-blue-300 font-semibold">
                            {vendor.category}
                          </span>
                          <h3 className="text-lg font-bold text-slate-900 dark:text-white mt-1">{vendor.companyName}</h3>
                        </div>
                        <input type="checkbox" checked={selectedForShare.includes(vendor.id)} onChange={() => toggleSelectForShare(vendor.id)} className="w-4 h-4 text-blue-600 rounded" />
                      </div>

                      <div className="text-sm text-slate-600 dark:text-slate-300 space-y-1">
                        <div><strong>Contact:</strong> {vendor.contactPerson || '—'}</div>
                        <div><strong>Phone:</strong> {vendor.phone || '—'}</div>
                        <div><strong>Email:</strong> {vendor.email || '—'}</div>
                        <div><strong>Website:</strong> {vendor.website || '—'}</div>
                        {vendor.specialties && <div><strong>Specialties:</strong> {vendor.specialties}</div>}
                      </div>

                      {vendor.notes && <p className="text-xs bg-slate-50 dark:bg-slate-900/60 p-2 rounded text-slate-500 italic">"{vendor.notes}"</p>}
                    </div>

                    <div className="flex items-center justify-between pt-3 border-t border-slate-100 dark:border-slate-700 text-xs">
                      <button onClick={() => handleCopyVendorInfo(vendor)} className="text-blue-600 font-medium">
                        {copiedId === vendor.id ? 'Copied!' : 'Copy Summary'}
                      </button>
                      <div className="flex items-center gap-2">
                        <button onClick={() => handleOpenModal(vendor)} className="text-slate-500 hover:text-blue-600">Edit</button>
                        <button onClick={() => handleDeleteVendor(vendor.id)} className="text-slate-500 hover:text-red-600">Delete</button>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            ) : (
              <div className="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl overflow-x-auto">
                <table className="w-full text-left text-sm">
                  <thead className="bg-slate-50 dark:bg-slate-900/50 text-xs text-slate-500 border-b border-slate-200 dark:border-slate-700">
                    <tr>
                      <th className="p-3">Select</th>
                      <th className="p-3">Company & Contact</th>
                      <th className="p-3">Category</th>
                      <th className="p-3">Phone & Email</th>
                      <th className="p-3">Status</th>
                      <th className="p-3 text-right">Actions</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100 dark:divide-slate-700">
                    {filteredVendors.map(vendor => (
                      <tr key={vendor.id}>
                        <td className="p-3"><input type="checkbox" checked={selectedForShare.includes(vendor.id)} onChange={() => toggleSelectForShare(vendor.id)} /></td>
                        <td className="p-3 font-semibold">{vendor.companyName}<div className="text-xs font-normal text-slate-400">{vendor.contactPerson}</div></td>
                        <td className="p-3">{vendor.category}</td>
                        <td className="p-3 text-xs">{vendor.phone}<br/>{vendor.email}</td>
                        <td className="p-3"><span className="px-2 py-0.5 text-xs bg-emerald-100 text-emerald-800 rounded">{vendor.status}</span></td>
                        <td className="p-3 text-right">
                          <button onClick={() => handleOpenModal(vendor)} className="text-xs text-blue-600 mr-2">Edit</button>
                          <button onClick={() => handleDeleteVendor(vendor.id)} className="text-xs text-red-600">Delete</button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </main>

          {/* Modal: Add/Edit Vendor */}
          {isModalOpen && (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50">
              <div className="bg-white dark:bg-slate-800 p-6 rounded-xl border border-slate-200 dark:border-slate-700 max-w-lg w-full space-y-4 max-h-[90vh] overflow-y-auto">
                <h2 className="text-lg font-bold">{editingVendor ? 'Edit Vendor Details' : 'Add Preferred Vendor'}</h2>
                <form onSubmit={handleSaveVendor} className="space-y-3">
                  <input required type="text" placeholder="Company Name *" value={formData.companyName} onChange={e => setFormData({...formData, companyName: e.target.value})} className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border rounded text-sm" />
                  <select value={formData.category} onChange={e => setFormData({...formData, category: e.target.value})} className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border rounded text-sm">
                    {CATEGORIES.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                  </select>
                  <input type="text" placeholder="Contact Person" value={formData.contactPerson} onChange={e => setFormData({...formData, contactPerson: e.target.value})} className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border rounded text-sm" />
                  <input type="text" placeholder="Phone" value={formData.phone} onChange={e => setFormData({...formData, phone: e.target.value})} className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border rounded text-sm" />
                  <input type="email" placeholder="Email" value={formData.email} onChange={e => setFormData({...formData, email: e.target.value})} className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border rounded text-sm" />
                  <input type="text" placeholder="Website" value={formData.website} onChange={e => setFormData({...formData, website: e.target.value})} className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border rounded text-sm" />
                  <input type="text" placeholder="Specialties" value={formData.specialties} onChange={e => setFormData({...formData, specialties: e.target.value})} className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border rounded text-sm" />
                  <textarea placeholder="Notes" value={formData.notes} onChange={e => setFormData({...formData, notes: e.target.value})} className="w-full px-3 py-2 bg-slate-50 dark:bg-slate-900 border rounded text-sm"></textarea>
                  
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setIsModalOpen(false)} className="px-4 py-2 bg-slate-200 dark:bg-slate-700 rounded text-sm">Cancel</button>
                    <button type="submit" className="px-4 py-2 bg-blue-600 text-white rounded text-sm font-medium">Save Vendor</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Modal: Client Share Format */}
          {clientShareModal.open && (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50">
              <div className="bg-white dark:bg-slate-800 p-6 rounded-xl border max-w-lg w-full space-y-4">
                <h2 className="text-lg font-bold">Share Recommendations ({clientShareModal.vendors.length})</h2>
                <div className="p-4 bg-slate-50 dark:bg-slate-900 rounded font-mono text-xs whitespace-pre-wrap max-h-60 overflow-y-auto">
                  🏡 PREFERRED VENDOR RECOMMENDATIONS{'\n\n'}
                  {clientShareModal.vendors.map((v, i) => (
                    `${i + 1}. ${v.companyName} [${v.category}]\n   Contact: ${v.contactPerson || 'N/A'}\n   Phone: ${v.phone || 'N/A'}\n   Email: ${v.email || 'N/A'}\n\n`
                  ))}
                </div>
                <div className="flex justify-end gap-2">
                  <button onClick={() => setClientShareModal({ open: false, vendors: [] })} className="px-4 py-2 bg-slate-200 dark:bg-slate-700 rounded text-sm">Close</button>
                  <button onClick={copyFormattedList} className="px-4 py-2 bg-blue-600 text-white rounded text-sm">Copy Formatted Text</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
